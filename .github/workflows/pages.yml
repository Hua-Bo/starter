# ============================================================
# GitHub Pages 自动部署
# 触发：推送到 main，或手动 workflow_dispatch
# 产物：推送到 gh-pages 分支
# 首次部署后需在 Settings → Pages 选择 gh-pages / root
# 访问：https://<用户名>.github.io/<仓库名>/
# ============================================================
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --progress=false

      - name: Build for GitHub Pages
        env:
          # GitHub Pages 项目页必须以 /仓库名/ 为根路径
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback and .nojekyll
        run: |
          # 404.html 用于 SPA 路由刷新回退
          cp dist/index.html dist/404.html
          # 禁用 Jekyll 处理，避免 _ 开头文件被忽略
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: GitHub Pages'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 可选：通过 GitHub Actions 托管 Pages（需在 Settings 中启用）
  deploy-actions:
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (Actions)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
